name: DataOps PySpark CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify Runtime Versions
        run: |
          python --version
          java -version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyspark==4.2.0 pytest==9.1.1

      - name: Execute PySpark Unit Tests
        run: |
          python -m pytest -v test_orders.py

      - name: Package Job Archive
        run: |
          zip -r job_archive.zip orders.py

      - name: Upload Job Archive
        uses: actions/upload-artifact@v4
        with:
          name: pyspark-job-archive
          path: job_archive.zip